[package]
name = "crypto"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sha2 = "0.11.0"
hkdf = "0.13.0"
rand = "0.8.7"
chacha20poly1305 = { version = "0.10.1", features = ["std"] }
aead = { version = "0.5.2", features = ["stream"] }
jni = "0.21.1"
crossbeam-channel = "0.5.16"
num_cpus = "1.17.0"

[dev-dependencies]
criterion = "0.5"
tempfile = "3"

[[bench]]
name = "crypto_benchmark"
harness = false
